<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras · Futuro Florestal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#1c2b22;--mut:#66756b;--line:#e2e7df;--g:#2d6a4f;--g2:#e5f1ea;--red:#b42318;--red2:#fdeceb;--amb:#9a5b06;--amb2:#fff3d6;--blue:#1d4e89;--blue2:#e6eefa}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:380px}
.box h1{font-size:22px;margin:0 0 4px}.box p{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
input[type=checkbox]{width:auto}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--g);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--g);color:#fff;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header small{opacity:.85}
header .btn.sec{background:transparent;color:#fff;border-color:#ffffff66}
main{padding:20px 24px;max-width:1400px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{font-size:28px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:12px}
.kpi.r b{color:var(--red)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input,.bar select{width:auto;min-width:130px}.bar input[type=search]{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--mut)}
.tab.on{background:var(--g2);color:var(--g)}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbf8;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:#f8faf6}
tr.late td:first-child{box-shadow:inset 3px 0 var(--red)}
tr.soon td:first-child{box-shadow:inset 3px 0 #d99a1f}
.sub{color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef0ec;color:var(--mut);white-space:nowrap}
.tag.red{background:var(--red2);color:var(--red)}.tag.amb{background:var(--amb2);color:var(--amb)}
.tag.g{background:var(--g2);color:var(--g)}.tag.b{background:var(--blue2);color:var(--blue)}
.next{font-size:12px;color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:16px;padding:0;width:min(720px,94vw);max-height:92vh}
dialog::backdrop{background:#0b1a1266}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-size:17px}
.db{padding:6px 22px 18px;overflow:auto;max-height:70vh}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.hist{font-size:12px;color:var(--mut);margin:6px 0 0;padding:0;list-style:none}
.hist li{padding:4px 0;border-bottom:1px dashed var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:14px}}
</style></head>
<body>
<section id="login"><form class="box" id="lf">
<h1>Compras · Futuro Florestal</h1><p>Entre com seu e-mail e senha.</p>
<label>E-mail</label><input type="email" id="em" required autocomplete="username">
<label>Senha</label><input type="password" id="pw" required autocomplete="current-password">
<div class="err" id="le"></div>
<button class="btn" style="width:100%;margin-top:6px">Entrar</button></form></section>

<div id="app" class="hide">
<header><h1>Compras · Futuro Florestal</h1><small id="who"></small>
<button class="btn sec" id="exp">Exportar CSV</button><button class="btn sec" id="out">Sair</button></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="tabs"><button class="tab on" data-t="pedidos">Solicitações</button><button class="tab" data-t="compras">Compras realizadas</button></div>
<div class="bar">
<input type="search" id="q" placeholder="Pesquisar por descrição…">
<select id="fc"></select><select id="fs"></select><select id="fst"></select>
<select id="fu"><option value="">Urgência: todas</option><option value="late">Atrasadas</option><option value="soon">Urgentes</option></select>
<button class="btn" id="new">+ Nova solicitação</button></div>
<div class="wrap"><table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Qtd.</th><th>Prazo</th><th>Solicitante</th><th>Status</th><th>Aprovação</th><th>Próxima ação</th></tr></thead><tbody id="tb"></tbody></table><div id="em0" class="empty hide">Nenhuma solicitação encontrada.</div></div>
</main></div>

<dialog id="dlg"><form id="f">
<div class="dh"><h2 id="dt"></h2><button type="button" class="btn sec" id="x">Fechar</button></div>
<div class="db"><div class="grid">
<div class="full"><label>Descrição *</label><input id="descricao" required></div>
<div><label>Categoria</label><select id="categoria"></select></div>
<div><label>Solicitante</label><input id="solicitante"></div>
<div><label>Quantidade</label><input id="quantidade" type="number" step="any" min="0"></div>
<div><label>Unidade</label><input id="unidade" list="uns"><datalist id="uns"><option>unid.</option><option>litro</option><option>kg</option><option>caixa</option><option>par</option><option>pacote</option></datalist></div>
<div class="full"><label>Motivo</label><input id="motivo"></div>
<div><label>Prazo</label><input id="prazo" type="date"></div>
<div><label>Enviado por</label><select id="canal_envio"><option value="">—</option><option>E-mail</option><option>WhatsApp</option></select></div>
<div><label>Status</label><select id="status"></select></div>
<div><label>Aprovação</label><select id="aprovacao"><option>Pendente</option><option>Aprovado</option><option>Reprovado</option></select></div>
<div><label>Data da compra</label><input id="data_compra" type="date"></div>
<div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--ink)"><input type="checkbox" id="urgente"> Marcar como urgente</label></div>
<div class="full"><label>Observações</label><textarea id="observacoes" rows="2"></textarea></div>
</div>
<div id="hw" class="hide"><label>Histórico</label><ul class="hist" id="hl"></ul></div></div>
<div class="df"><button type="button" class="btn sec" id="c2">Cancelar</button><button class="btn" id="sv">Salvar</button></div>
</form></dialog>
<div id="toast" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://dpouhdddwvtppsfduaxe.supabase.co','sb_publishable_oHh5qSUOoMT5ORliM06ohw_1QmXkAsG');
const STATUS=['Nova solicitação','Aguardando informações','Em análise','Em cotação','Aguardando aprovação','Aprovada','Compra realizada','Aguardando entrega','Recebida/concluída','Reprovada/cancelada'];
const CATS=['Material','EPI','Manutenção','Ferramentas','Limpeza','Adubo/Fertilizante','Outros'];
const NEXT={'Nova solicitação':'Compras: conferir o pedido','Aguardando informações':'Solicitante: enviar informações','Em análise':'Compras: decidir cotar ou comprar','Em cotação':'Compras: reunir orçamentos','Aguardando aprovação':'Gestão: aprovar ou reprovar','Aprovada':'Compras: realizar a compra','Compra realizada':'Compras: acompanhar a entrega','Aguardando entrega':'Receber e conferir o item','Recebida/concluída':'Nada pendente','Reprovada/cancelada':'Encerrada'};
const PAPEL={solicitante:'Solicitante',compras:'Compras',gestao:'Gestão'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const open=s=>!['Recebida/concluída','Reprovada/cancelada'].includes(s);
const fd=d=>d?d.split('-').reverse().join('/'):'—';
let me=null,rows=[],tab='pedidos',cur=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),3500)}
function dias(p){if(!p)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(p+'T00:00')-t)/864e5)}
function urg(r){if(!open(r.status))return '';const d=dias(r.prazo);if(d!==null&&d<0)return 'late';if(r.urgente||(d!==null&&d<=2))return 'soon';return ''}
function prazoTag(r){const u=urg(r),d=dias(r.prazo);if(u==='late')return `<span class="tag red">Atrasada ${-d}d</span><div class="sub">${fd(r.prazo)}</div>`;
 if(u==='soon')return `<span class="tag amb">${r.urgente?'Urgente':d===0?'Vence hoje':'Vence em '+d+'d'}</span><div class="sub">${fd(r.prazo)}</div>`;return fd(r.prazo)}
function stTag(s){const c=s==='Recebida/concluída'?'g':s==='Reprovada/cancelada'?'red':s==='Aguardando aprovação'?'amb':'b';return `<span class="tag ${c}">${s}</span>`}
function apTag(a){return `<span class="tag ${a==='Aprovado'?'g':a==='Reprovado'?'red':''}">${a}</span>`}

$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
 const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)$('#le').textContent='E-mail ou senha incorretos.';else start()};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function start(){
 const {data:{user}}=await sb.auth.getUser();if(!user)return;
 const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
 me={id:user.id,nome:p?.nome||user.email,papel:p?.papel||'solicitante'};
 $('#who').textContent=`${me.nome} · ${PAPEL[me.papel]}`;
 $('#login').classList.add('hide');$('#app').classList.remove('hide');
 $('#categoria').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
 $('#status').innerHTML=STATUS.map(c=>`<option>${c}</option>`).join('');
 $('#fc').innerHTML='<option value="">Categoria: todas</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
 $('#fst').innerHTML='<option value="">Status: todos</option>'+STATUS.map(c=>`<option>${c}</option>`).join('');
 load()}
async function load(){
 const {data,error}=await sb.from('solicitacoes').select('*').order('id',{ascending:false});
 if(error){toast('Erro ao carregar: '+error.message);return}
 rows=data;const s=[...new Set(rows.map(r=>r.solicitante).filter(Boolean))].sort();
 const v=$('#fs').value;$('#fs').innerHTML='<option value="">Solicitante: todos</option>'+s.map(c=>`<option>${esc(c)}</option>`).join('');$('#fs').value=v;render()}
function render(){
 const op=rows.filter(r=>open(r.status));
 const K=[['Abertas',op.length],['Aguardando aprovação',rows.filter(r=>r.status==='Aguardando aprovação').length],['Em andamento',rows.filter(r=>['Em análise','Em cotação','Aprovada','Compra realizada','Aguardando entrega'].includes(r.status)).length],['Concluídas',rows.filter(r=>r.status==='Recebida/concluída').length],['Atrasadas',rows.filter(r=>urg(r)==='late').length]];
 $('#kpis').innerHTML=K.map((k,i)=>`<div class="kpi ${i===4&&k[1]?'r':''}"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
 const q=$('#q').value.toLowerCase(),fc=$('#fc').value,fs=$('#fs').value,fst=$('#fst').value,fu=$('#fu').value;
 let l=rows.filter(r=>(tab==='pedidos'||r.data_compra)&&(!q||(r.descricao||'').toLowerCase().includes(q))&&(!fc||r.categoria===fc)&&(!fs||r.solicitante===fs)&&(!fst||r.status===fst)&&(!fu||urg(r)===fu));
 l.sort((a,b)=>(open(b.status)-open(a.status))||((a.prazo||'9')>(b.prazo||'9')?1:-1));
 $('#tb').innerHTML=l.map(r=>`<tr data-id="${r.id}" class="${urg(r)}"><td>${fd(r.data_solicitacao)}</td><td>${esc(r.categoria)}</td><td><b>${esc(r.descricao)}</b>${r.teste?' <span class="tag">TESTE</span>':''}<div class="sub">${esc(r.motivo)}${r.observacoes?' · '+esc(r.observacoes):''}</div></td><td>${r.quantidade??'—'} ${esc(r.unidade)}</td><td>${prazoTag(r)}${tab==='compras'?`<div class="sub">Comprado em ${fd(r.data_compra)}</div>`:''}</td><td>${esc(r.solicitante)}</td><td>${stTag(r.status)}</td><td>${apTag(r.aprovacao)}</td><td class="next">${NEXT[r.status]}</td></tr>`).join('');
 $('#em0').classList.toggle('hide',l.length>0);window._l=l}
['q','fc','fs','fst','fu'].forEach(i=>$('#'+i).oninput=render);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#tb').onclick=e=>{const tr=e.target.closest('tr');if(tr)edit(rows.find(r=>r.id==tr.dataset.id))};
$('#new').onclick=()=>edit(null);
const F=['descricao','categoria','solicitante','quantidade','unidade','motivo','prazo','canal_envio','status','aprovacao','data_compra','observacoes'];
async function edit(r){cur=r;$('#dt').textContent=r?'Editar solicitação':'Nova solicitação';
 F.forEach(k=>$('#'+k).value=r?(r[k]??''):({solicitante:me.nome,unidade:'unid.',status:'Nova solicitação',aprovacao:'Pendente',categoria:'Material'}[k]??''));
 $('#urgente').checked=!!r?.urgente;$('#aprovacao').disabled=me.papel!=='gestao';
 $('#hw').classList.toggle('hide',!r);if(r){$('#hl').innerHTML='<li>Carregando…</li>';
  const {data}=await sb.from('historico').select('*').eq('solicitacao_id',r.id).order('id',{ascending:false});
  $('#hl').innerHTML=(data||[]).map(h=>`<li>${new Date(h.criado_em).toLocaleString('pt-BR')} · ${esc(h.usuario_nome)} · ${esc(h.campo)}${h.valor_antigo?': '+esc(h.valor_antigo)+' → ':': '}${esc(h.valor_novo)}</li>`).join('')||'<li>Sem alterações registradas.</li>'}
 $('#dlg').showModal()}
$('#x').onclick=$('#c2').onclick=()=>$('#dlg').close();
$('#f').onsubmit=async e=>{e.preventDefault();$('#sv').disabled=true;
 const o={};F.forEach(k=>{let v=$('#'+k).value.trim();o[k]=v===''?null:v});o.quantidade=o.quantidade===null?null:Number(o.quantidade);o.urgente=$('#urgente').checked;
 if(me.papel!=='gestao'&&cur)delete o.aprovacao;if(me.papel!=='gestao'&&!cur)o.aprovacao='Pendente';
 const {error}=cur?await sb.from('solicitacoes').update(o).eq('id',cur.id):await sb.from('solicitacoes').insert(o);
 $('#sv').disabled=false;
 if(error){toast(error.message.includes('row-level')?'Você não tem permissão para editar este pedido.':error.message);return}
 $('#dlg').close();toast('Salvo.');load()};
$('#exp').onclick=()=>{const h=['Data','Categoria','Descrição','Quantidade','Unidade','Motivo','Prazo','Urgente','Solicitante','Status','Enviado por','Aprovação','Data da compra','Observações','Teste'];
 const k=['data_solicitacao','categoria','descricao','quantidade','unidade','motivo','prazo','urgente','solicitante','status','canal_envio','aprovacao','data_compra','observacoes','teste'];
 const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const t=[h.map(c).join(';'),...rows.map(r=>k.map(x=>c(r[x])).join(';'))].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download='compras-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
sb.auth.getSession().then(({data})=>{if(data.session)start()});
</script></body></html>
